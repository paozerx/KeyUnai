version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: keyunai_postgres
    environment:
      POSTGRES_DB: keyunai_db
      POSTGRES_USER: keyunai_user
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: